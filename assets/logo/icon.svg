<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- CalcAll: ∀ ("for all") whose crossbar is a plotted curve -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3039"/>
      <stop offset="1" stop-color="#15171c"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb35c"/>
      <stop offset="1" stop-color="#e8791c"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5aa9f0"/>
      <stop offset="1" stop-color="#3f86d8"/>
    </linearGradient>
    <clipPath id="clip"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <g clip-path="url(#clip)" stroke="#ffffff" stroke-opacity="0.05" stroke-width="3">
    <path d="M100 237H924M100 374H924M100 512H924M100 649H924M100 786H924"/>
    <path d="M237 100V924M374 100V924M512 100V924M649 100V924M786 100V924"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <!-- the ∀ -->
  <path d="M300 285 L512 765 L724 285" fill="none" stroke="url(#orange)" stroke-width="96"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- its crossbar, drawn as a curve on the graph -->
  <path d="M366 486 C 420 420, 460 420, 512 466 S 600 512, 656 446" fill="none" stroke="url(#blue)"
        stroke-width="46" stroke-linecap="round"/>
  <circle cx="441" cy="436" r="27" fill="#f4f5f8"/>
  <circle cx="441" cy="436" r="11" fill="#3f86d8"/>
</svg>
