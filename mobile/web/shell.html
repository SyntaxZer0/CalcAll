<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>CalcAll</title>
<meta name="description" content="A calculator that keeps numbers exact, with natural display, tables and graphs.">
<meta name="theme-color" content="#181a1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CalcAll">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-256.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #181a1f;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* The app fills the screen, inside the notch and the home bar. */
  #canvas {
    position: fixed;
    left: env(safe-area-inset-left, 0);
    top: env(safe-area-inset-top, 0);
    width: calc(100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)) !important;
    height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 40px) !important;
    height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 40px) !important;
    display: block;
    touch-action: none;
    outline: none;
  }
  /* Typing goes through this hidden box, which is what brings up the phone's keyboard. */
  #kbd {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 1px;
    height: 1px;
    opacity: 0;
    border: 0;
    padding: 0;
    font-size: 16px; /* smaller text makes iOS zoom the page */
  }
  /* A strip under the app with the button that brings up the keyboard. */
  #bar {
    position: fixed;
    left: env(safe-area-inset-left, 0);
    right: env(safe-area-inset-right, 0);
    bottom: env(safe-area-inset-bottom, 0);
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 12px;
  }
  #kbd-button {
    height: 30px;
    padding: 0 14px;
    border-radius: 8px;
    border: 0;
    background: #2c2f37;
    color: #c9ccd5;
    font: 14px -apple-system, system-ui, sans-serif;
  }
  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #8a8f9c;
    font: 15px -apple-system, system-ui, sans-serif;
  }
</style>
</head>
<body>
<div id="loading">Loading CalcAll…</div>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
<input id="kbd" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
       enterkeyhint="done" aria-label="Type into CalcAll">
<div id="bar"><button id="kbd-button">⌨ Keyboard</button></div>
<script>
  /*
   * Typing on a phone: tapping ⌨ focuses the hidden box, which brings up the
   * keyboard. What's typed into it is handed to the app (shim.c takes it
   * from this queue, in order) instead of reaching the box: a character is
   * its code, a key (Enter, Backspace, ...) is minus raylib's code for it.
   */
  var Module = {
    canvas: document.getElementById('canvas'),
    calcallInput: [],
    print: function () {},
    printErr: function () {},
    onRuntimeInitialized: function () { document.getElementById('loading').remove(); },
  };
  (function () {
    var kbd = document.getElementById('kbd');
    var button = document.getElementById('kbd-button');
    /* raylib's key codes */
    var KEYS = {Enter: 257, Backspace: 259, Tab: 258, Escape: 256, Delete: 261,
                ArrowRight: 262, ArrowLeft: 263, ArrowDown: 264, ArrowUp: 265, Home: 268, End: 269};

    button.addEventListener('click', function (e) {
      e.preventDefault();
      if (document.activeElement === kbd) kbd.blur(); else kbd.focus();
    });
    /* Tapping the button would take the focus away before the click: keep it. */
    button.addEventListener('mousedown', function (e) { e.preventDefault(); });
    kbd.addEventListener('focus', function () { button.textContent = 'Hide keyboard'; });
    kbd.addEventListener('blur', function () { button.textContent = '⌨ Keyboard'; });
    /* Keys typed into the box: the special ones go to the app as keys, and
     * nothing reaches raylib's own keyboard handling (listening on window),
     * which would see each character a second time. */
    ['keydown', 'keypress', 'keyup'].forEach(function (type) {
      window.addEventListener(type, function (e) {
        if (e.target !== kbd) return;
        e.stopImmediatePropagation();
        if (type === 'keydown' && KEYS[e.key]) {
          Module.calcallInput.push(-KEYS[e.key]);
          e.preventDefault();
        }
      }, true);
    });
    /* Characters arrive as input, however the keyboard sends them. */
    kbd.addEventListener('input', function (e) {
      var text = kbd.value;
      kbd.value = '';
      if (e.inputType === 'insertLineBreak') { Module.calcallInput.push(-257); return; }
      if (e.inputType && e.inputType.indexOf('delete') === 0) { Module.calcallInput.push(-259); return; }
      for (var ch of text) Module.calcallInput.push(ch.codePointAt(0));
    });
    /* Save straight away when the app is put away. */
    function save() {
      if (Module.calcallLoaded && typeof FS !== 'undefined') FS.syncfs(false, function () {});
    }
    document.addEventListener('visibilitychange', function () { if (document.hidden) save(); });
    window.addEventListener('pagehide', save);
    /* Offline use in the browser (the Android app has its files built in). */
    if ('serviceWorker' in navigator && location.search.indexOf('app') < 0)
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
  })();
</script>
{{{ SCRIPT }}}
</body>
</html>
